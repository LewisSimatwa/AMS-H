services:
  - type: web
    name: ams-h-php
    env: php
    buildCommand: ""
    startCommand: ""
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: https://ams-h.vercel.app
      - path: /*
        name: Access-Control-Allow-Methods
        value: GET, POST, PUT, DELETE, OPTIONS
      - path: /*
        name: Access-Control-Allow-Headers
        value: Content-Type, Authorization, X-Institution-ID
      - path: /*
        name: Access-Control-Allow-Credentials
        value: "true"
